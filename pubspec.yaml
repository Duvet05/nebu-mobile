name: nebu_mobile_flutter
description: "Nebu — smart toy companion app with Bluetooth pairing, real-time walkie talkie (WebRTC), AI personalities, and parental controls."
publish_to: 'none'

version: 1.2.4+1058

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3

  # Navigation
  go_router: ^16.2.4

  # HTTP & API
  dio: ^5.4.3
  json_annotation: ^4.12.0

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1

  # Authentication - Social Login
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0

  # Bluetooth
  flutter_blue_plus: ^2.0.0

  # Permissions
  permission_handler: ^12.0.1
  device_info_plus: ^12.3.0

  # Network Info
  network_info_plus: ^6.1.1
  # Android-only fork: iOS does not expose a Wi-Fi scan API. Keeping the
  # unsupported iOS stub would force CocoaPods for no runtime functionality.
  wifi_scan:
    path: packages/wifi_scan_android

  # QR (pure Dart decoder, no ML Kit)
  qr_code_dart_scan: ^0.11.5

  # Image
  flutter_svg: ^2.3.0
  image_picker: ^1.0.7

  # LiveKit (WebRTC)
  # Pinned to the first official upstream commit with Swift Package Manager
  # support. Replace with the next pub.dev release containing this commit.
  livekit_client:
    git:
      url: https://github.com/livekit/client-sdk-flutter.git
      ref: 4ac86745366e27694990f95f8cd910b376bd7594

  # Internationalization
  easy_localization: ^3.0.7

  # Firebase
  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.8
  firebase_messaging: ^16.0.0

  # Utilities
  logger: ^2.3.0
  freezed_annotation: ^3.1.0
  uuid: ^4.5.1
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  web: ^1.1.1

  # UI Helpers
  package_info_plus: ^9.0.0
  google_fonts: ^8.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mockito: ^5.6.4

  # Code Generation
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.7.1

  # Launcher Icons
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  # The upstream SwiftPM manifest enables the generic location strategy when
  # NSLocationWhenInUseUsageDescription is present, which leaves
  # requestAlwaysAuthorization in the binary. This vendored iOS implementation
  # compiles only the foreground location strategy used by Nebu.
  permission_handler_apple:
    path: packages/permission_handler_apple

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  config:
    enable-swift-package-manager: true

  uses-material-design: true

  assets:
    # Keep runtime assets explicit; broad directories inflate store bundles.
    - assets/images/google_logo.png
    - assets/images/decoration-blob-teal.png
    - assets/images/decoration-blob-yellow.png
    - assets/images/decoration-strokes-scattered.png
    - assets/images/background-pattern.webp
    - assets/icons/dino.svg
    - assets/icons/lucide/settings.svg
    - assets/icons/lucide/plus.svg
    - assets/icons/lucide/mic.svg
    - assets/icons/lucide/book-open.svg
    - assets/icons/lucide/sparkles.svg
    - assets/icons/lucide/bluetooth-connected.svg
    - assets/icons/lucide/battery-full.svg
    - assets/icons/lucide/battery-medium.svg
    - assets/icons/lucide/battery-low.svg
    - assets/icons/lucide/battery-warning.svg
    - assets/icons/lucide/circle-alert.svg
    - assets/logos/nebu.svg
    - assets/translations/
    - assets/icon_nebu_1024.png
    - assets/google_fonts/

  fonts:
    - family: GochiHand
      fonts:
        - asset: assets/fonts/GochiHand-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_nebu_1024.png"
  adaptive_icon_background: "#6B4EFF"
  adaptive_icon_foreground: "assets/icon_nebu_1024.png"
  remove_alpha_ios: true
